  <!-- Thème appliqué avant le premier rendu pour éviter tout flash : choix mémorisé, sinon préférence système, sinon sombre -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) { }
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F2EB');
    })();
  </script>
